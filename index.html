<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>lesson13</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<div class="main-container">
    <div class="form-side">
        <div class="form-content">
            <h2 class="form-title" id="form-title">Get your free account</h2>
            <p class="form-text" id="form-description">Try homeWorks BUSINESS free for 15 days. Downgrade to Basic (Free Forever)
                anytime.</p>


            <form action="#" id="registrationForm">

                <div class="input-group" id="full-name-input">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName">
                </div>

                <div class="input-group" id="username-input">
                    <label for="username">Your username</label>
                    <input type="text" id="username">
                </div>

                <div class="input-group" id="email-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email">
                </div>

                <div class="input-group" id="password-input">
                    <label for="password">Password</label>
                    <input type="password" id="password">
                </div>

                <div class="input-group" id="repeat-password-input">
                    <label for="password">Repeat password</label>
                    <input type="password" id="repeat-password">
                </div>

                <div class="checkbox-group" id="checkbox-input">
                    <input type="checkbox" id="agree">
                    <label for="agree">Agree to our Terms of Service and Privacy Statement</label>
                </div>

                <button type="submit" class="button" id="signUpBtn">Sign up</button>

                <div class="login-link" id="login-link-box">
                    <a id="login-link" href="#">Already have an account?</a>
                </div>


            </form>
        </div>
    </div>

    <div class="image-side">
        <img src="images/image.png" alt="img-logo">
    </div>

</div>


<div class="logo">
    <img src="images/homeWorks.png" alt="logo">
</div>


<div class="popup" id="popUp">
    <div class="popup-content">
        <p>На вашу почту выслана ссылка, перейдите по ней, чтобы завершить регистрацию</p>
        <button id="okBtn">ОК</button>
    </div>
</div>

<script src="scripts/script.js"></script>
</body>
</html>
